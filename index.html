<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Peminjaman Alat - Modern</title>
    <!-- Menggunakan Font Google Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Font Awesome untuk Ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #0d9488; /* Teal Modern */
            --primary-dark: #0f766e;
            --bg-body: #f3f4f6;
            --bg-sidebar: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            --danger: #ef4444;
            --warning: #f59e0b;
            --success: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
        }

        /* --- Sidebar Styling --- */
        .sidebar {
            width: 260px;
            background: var(--bg-sidebar);
            border-right: 1px solid #e5e7eb;
            display: flex;
            flex-direction: column;
            padding: 20px;
            position: fixed;
            height: 100%;
            z-index: 10;
        }

        .brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid #f3f4f6;
        }

        .brand-logo {
            width: 70px;
            height: 70px;
            background: #e0f2fe;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            color: var(--primary);
            font-size: 32px;
        }

        .brand h1 {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 1px;
            color: var(--primary-dark);
        }
        
        .brand span {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 400;
        }

        .menu {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px 16px;
            border-radius: 10px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .menu-item:hover {
            background-color: #f0fdfa;
            color: var(--primary);
        }

        .menu-item.active {
            background-color: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(13, 148, 136, 0.3);
        }

        /* --- Main Content Styling --- */
        .main-content {
            margin-left: 260px;
            flex: 1;
            padding: 30px 40px;
            width: calc(100% - 260px);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .header h2 {
            font-size: 24px;
            font-weight: 600;
        }

        /* --- Stats Cards --- */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
            margin-bottom: 30px;
        }

        .card {
            border-radius: 16px;
            padding: 24px;
            color: white;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card.teal { background: linear-gradient(135deg, #14b8a6 0%, #0d9488 100%); }
        .card.orange { background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%); }
        .card.red { background: linear-gradient(135deg, #f87171 0%, #ef4444 100%); }

        .card-info h3 {
            font-size: 14px;
            font-weight: 400;
            opacity: 0.9;
            margin-bottom: 8px;
        }

        .card-info .value {
            font-size: 32px;
            font-weight: 700;
        }

        .card-icon {
            font-size: 40px;
            opacity: 0.3;
        }

        /* --- Content Panel (Table) --- */
        .content-panel {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: var(--card-shadow);
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .panel-title {
            color: var(--danger);
            font-weight: 600;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .search-bar {
            position: relative;
            width: 300px;
        }

        .search-bar input {
            width: 100%;
            padding: 10px 15px 10px 40px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
            transition: border 0.2s;
        }

        .search-bar input:focus {
            border-color: var(--primary);
        }

        .search-bar i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        /* --- Tabs --- */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid #e5e7eb;
            padding-bottom: 10px;
        }

        .tab-btn {
            background: none;
            border: none;
            padding: 8px 16px;
            cursor: pointer;
            font-weight: 500;
            color: var(--text-muted);
            border-radius: 6px;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background-color: #ccfbf1;
            color: var(--primary-dark);
            font-weight: 600;
        }

        /* --- Table --- */
        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            padding: 12px 16px;
            background-color: #f9fafb;
            color: var(--text-muted);
            font-weight: 500;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            padding: 16px;
            border-bottom: 1px solid #f3f4f6;
            font-size: 14px;
            color: var(--text-main);
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background-color: #f9fafb;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            font-style: italic;
        }

    </style>
</head>
<body>

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="brand">
            <div class="brand-logo">
                <i class="fa-solid fa-screwdriver-wrench"></i>
            </div>
            <h1>ALATKERJA</h1>
            <span>Central Workshop</span>
        </div>

        <nav class="menu">
            <a href="#" class="menu-item active">
                <i class="fa-solid fa-gauge-high"></i> Dashboard
            </a>
            <a href="#" class="menu-item">
                <i class="fa-solid fa-clipboard-list"></i> Peminjaman Alat
            </a>
            <a href="#" class="menu-item">
                <i class="fa-solid fa-toolbox"></i> Data Master Alat
            </a>
            <a href="#" class="menu-item">
                <i class="fa-solid fa-chart-line"></i> Laporan
            </a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <div class="header">
            <h2>Dashboard</h2>
            <div class="user-profile">
                <!-- Placeholder untuk profil user -->
                <i class="fa-regular fa-bell" style="font-size: 20px; color: #6b7280; cursor: pointer;"></i>
            </div>
        </div>

        <!-- Statistic Cards -->
        <div class="stats-grid">
            <div class="card teal">
                <div class="card-info">
                    <h3>Belum Kembali</h3>
                    <div class="value">0</div>
                </div>
                <div class="card-icon"><i class="fa-regular fa-clock"></i></div>
            </div>

            <div class="card orange">
                <div class="card-info">
                    <h3>Alat Rusak</h3>
                    <div class="value">0</div>
                </div>
                <div class="card-icon"><i class="fa-solid fa-wrench"></i></div>
            </div>

            <div class="card red">
                <div class="card-info">
                    <h3>Alat Hilang</h3>
                    <div class="value">0</div>
                </div>
                <div class="card-icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
            </div>
        </div>

        <!-- Content Panel -->
        <div class="content-panel">
            <div class="panel-header">
                <div class="panel-title">
                    <i class="fa-solid fa-circle-exclamation"></i> Alat Belum Dikembalikan
                </div>
                <div class="search-bar">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" placeholder="Cari data...">
                </div>
            </div>

            <!-- Tabs -->
            <div class="tabs">
                <button class="tab-btn active">Fabrikasi</button>
                <button class="tab-btn">Instalasi</button>
            </div>

            <!-- Table -->
            <table>
                <thead>
                    <tr>
                        <th>No</th>
                        <th>Nama</th>
                        <th>Status</th>
                        <th>Alat</th>
                        <th>Tgl Pinjam</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="6" class="empty-state">
                            <i class="fa-regular fa-folder-open" style="font-size: 24px; margin-bottom: 10px; display: block;"></i>
                            Tidak ada data peminjaman
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

</body>
</html>
